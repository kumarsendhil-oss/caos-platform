name: Docs table lint

# Deliberately a separate workflow rather than a job inside ci.yml: this
# keeps its path filter independent of ci.yml's, which has none today
# (see PENDING:022 in docs/STUB_ISSUES.md).
#
# The filter includes the checker and this workflow alongside docs/ -- a
# docs/**-only filter would mean the check never runs on a PR that
# changes the check itself.

# Triggers on pull_request only -- the `push: branches: [main]` trigger
# was removed 2026-09-21.
#
# THIS REMOVAL DEPENDS ON main's BRANCH PROTECTION. If that protection is
# loosened, restore the push trigger here. As read from classic
# branch-protection config on 2026-09-21:
#
#   - `enforce_admins: true`, `allow_force_pushes: false`, and two
#     required status checks -- so no commit reaches main except through
#     a PR. Admins included; there is no direct-push path to exempt.
#   - `required_status_checks.strict: true` -- so a branch must be up to
#     date with main before it can merge, which makes the merge commit's
#     tree byte-identical to the PR head's tree. Verified on the last
#     merge at the time: `git rev-parse ae4b34d^{tree} ae4b34d^2^{tree}`
#     returned 286415a0... for both.
#
# Together those mean a push-to-main run re-tested a tree that had
# already passed on the PR minutes earlier. Drop EITHER property --
# allow direct pushes, or turn off `strict` -- and that stops holding:
# main could then carry a tree no PR run ever saw, and with no push
# trigger nothing here would catch it. Restore the trigger at the same
# time you loosen the rule, not afterwards.
#
# Scope note: only classic branch protection was read, not repository
# rulesets (`gh api repos/:owner/:repo/rulesets`). See PENDING:022.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_*.py"
      - ".github/workflows/md-tables.yml"
      - ".ruff.toml"

jobs:
  tables:
    name: Markdown tables + script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stdlib only -- no install step, so CG1's pinned-dependency clause
      # is not engaged.
      - name: Check markdown tables
        run: python scripts/check_md_tables.py docs/

      # Each document's changelog is the single source of truth for its
      # version (prompt-conventions section 9). This replaces the version
      # manifest that was queued from PR #70: a manifest stores a copy, and a
      # stored copy goes stale -- PRD section 3 is that table and it went
      # stale the day PR #71 rebuilt it.
      - name: Check document versions
        run: python scripts/check_doc_versions.py docs/

      # CG1 -- zero warnings, same rule set and same pinned ruff version
      # as services/api/pyproject.toml's dev extra. Pinned, not floating:
      # a linter that silently upgrades turns an unrelated PR red.
      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check scripts/ --no-fix
