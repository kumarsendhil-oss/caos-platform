name: Docs table lint

# Deliberately a separate workflow rather than a job inside ci.yml: this
# keeps its path filter independent of ci.yml's, which has none today
# (see PENDING:022 in docs/STUB_ISSUES.md).
#
# The filter includes the checker and this workflow alongside docs/ -- a
# docs/**-only filter would mean the check never runs on a PR that
# changes the check itself.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_*.py"
      - ".github/workflows/md-tables.yml"
      - ".ruff.toml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_*.py"
      - ".github/workflows/md-tables.yml"
      - ".ruff.toml"

jobs:
  tables:
    name: Markdown tables + script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stdlib only -- no install step, so CG1's pinned-dependency clause
      # is not engaged.
      - name: Check markdown tables
        run: python scripts/check_md_tables.py docs/

      # Each document's changelog is the single source of truth for its
      # version (prompt-conventions section 9). This replaces the version
      # manifest that was queued from PR #70: a manifest stores a copy, and a
      # stored copy goes stale -- PRD section 3 is that table and it went
      # stale the day PR #71 rebuilt it.
      - name: Check document versions
        run: python scripts/check_doc_versions.py docs/

      # CG1 -- zero warnings, same rule set and same pinned ruff version
      # as services/api/pyproject.toml's dev extra. Pinned, not floating:
      # a linter that silently upgrades turns an unrelated PR red.
      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check scripts/ --no-fix
